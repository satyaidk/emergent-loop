# Runs the whole system: the Hindsight memory server + the LearnLoop app.
#
#   1. cp .env.example .env   and pick Option A (OpenAI) or Option B (Ollama) in it
#   2. docker compose up --build
#   3. open http://localhost:8000 (app) and http://localhost:9999 (Hindsight's memory explorer)

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    ports:
      - "8888:8888" # Hindsight API
      - "9999:9999" # Hindsight UI: browse banks, facts, entities and observations
    # Hindsight uses an LLM internally to extract facts on retain and to reason on reflect.
    # Which one (OpenAI or Ollama) is set by the HINDSIGHT_API_LLM_* lines in .env.
    env_file: .env
    environment:
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      # A fixed name for Hindsight's background worker. On startup it picks up jobs it left unfinished,
      # but only under its own name; by default the name is the container id, which changes whenever
      # the container is recreated, and those jobs would then be stuck forever.
      HINDSIGHT_API_WORKER_ID: learnloop-hindsight
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach Ollama on your computer
    volumes:
      - hindsight-data:/home/hindsight/.pg0 # embedded Postgres; memories survive restarts
    healthcheck:
      # The image has no curl, so use its Python to call the health endpoint.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s # first boot downloads embedding models

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LEARNLOOP_HINDSIGHT_URL: http://hindsight:8888 # service name, not localhost, inside the compose network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hindsight:
        condition: service_healthy

volumes:
  hindsight-data:
