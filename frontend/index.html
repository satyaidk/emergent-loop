<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LearnLoop: a programming tutor that remembers what you've learned." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LearnLoop</title>
    <script>
      // Apply the saved theme before the page paints, so dark mode never flashes white.
      try {
        var saved = JSON.parse(localStorage.getItem("learnloop.state.v1") || "null");
        var settings = (saved && saved.settings) || {};
        var theme = settings.theme || "system";
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.textSize = settings.textSize || "default";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
